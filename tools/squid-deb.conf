# squid-deb — URL-keyed caching proxy for KLH builds (docs/reproducible-builds.md)
# Durable home: this file (the original lived in /tmp and died with a reboot,
# taking the container down with it — found 2026-11-20).
#
# Recreate the container:
#   sudo docker rm -f squid-deb
#   sudo docker run -d --name squid-deb -p 8000:3129 \
#     -v squid-deb-cache:/var/spool/squid \
#     -v "$(pwd)/tools/squid-deb.conf":/etc/squid/squid.conf:ro \
#     ubuntu/squid:latest
http_port 3129
cache_dir ufs /var/spool/squid 10000 16 256
maximum_object_size 4 GB
coredump_dir /var/spool/squid

# cache archive artifacts from the distro/pinned mirrors (http only —
# https would be CONNECT-tunneled and uncachable without ssl-bump)
acl mirrors dstdomain .debian.org .deb.debian.org ftp.se.debian.org .kali.org kali.download http.kali.org accum.se
acl pkgfiles urlpath_regex -i \.(deb|udeb|dsc|diff\.gz|tar\.gz|tar\.xz|tar\.bz2)$
cache allow mirrors pkgfiles
cache deny all

# offline-friendly defaults for a dedicated build cache
connect_timeout 30 seconds
read_timeout 5 minutes
http_access allow localhost
http_access allow all

---
- name: Require explicit confirmation
  ansible.builtin.assert:
    that: ventoy_confirm | lower == 'yes'
    fail_msg: "Refusing to update Ventoy without CONFIRM=yes."

- name: Prepare the pinned Ventoy release
  ansible.builtin.import_tasks: release.yml
  tags: [install, update]

- name: Update Ventoy in place (keeps existing ISOs)
  ansible.builtin.command:
    cmd: "./Ventoy2Disk.sh -u {{ ventoy_dev_path }}"
    chdir: "{{ ventoy_cache_dir }}/ventoy-{{ ventoy_version }}"
    stdin: "y\ny\n"
  become: true
  register: ventoy_update_output
  changed_when: true

- name: Show the updater output
  ansible.builtin.debug:
    var: ventoy_update_output.stdout_lines

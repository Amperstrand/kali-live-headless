// kali-live-headless: resilience against flaky build-host networks.
//
// The Kali chroot install phase downloads ~3 GB over one or more
// long-lived HTTP connections. On lossy links (e.g. laptop Wi-Fi /
// hotspots) a silently black-holed TCP flow blocks apt's read() forever —
// no error, no retry, build hangs (observed twice on 2026-10-21, two
// different mirrors). Short read timeouts turn those stalls into errors
// that Acquire::Retries + live-build's xargs loop can recover from.
Acquire::Retries "10";
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
Acquire::ftp::Timeout "30";

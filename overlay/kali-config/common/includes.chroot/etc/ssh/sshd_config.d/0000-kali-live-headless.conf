# kali-live-headless SSH hardening.
#
# sshd uses first-match-wins and Debian/Kali's sshd_config includes
# sshd_config.d/*.conf at the TOP, so a file sorting first here wins over
# both the distro defaults and Kali's live-config component
# /usr/lib/live/config/1165-fix-openssh-server (which re-enables password
# auth on live boots by editing only the main sshd_config — this drop-in
# is unaffected by that sed).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
UsePAM yes

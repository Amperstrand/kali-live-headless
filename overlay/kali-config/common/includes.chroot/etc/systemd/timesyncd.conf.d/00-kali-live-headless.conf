# kali-live-headless clock policy (2026-10-26, the v31 sqv incident).
#
# A live stick with a dead/wrong RTC has NO trustworthy clock: apt's sqv
# refuses signatures "not live until <future>" and TLS validation fails the
# same way. systemd-timesyncd is shipped + enabled; once NetworkManager
# brings a link up it syncs (distro defaults first, then these fallbacks —
# stock pools may be blocked on lab LANs; operators override via KLHCONFIG
# headless-wifi.conf: NTP_SERVERS=host1,host2 — provision writes a
# higher-priority drop-in at first boot).
[Time]
FallbackNTP=pool.ntp.org time.cloudflare.com

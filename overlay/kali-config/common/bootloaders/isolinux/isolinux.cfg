# Overrides live-build's generated isolinux.cfg (which ships timeout 0 =
# wait forever at the menu). 50 = 5 seconds, then the default entry
# ("Live system") boots — required for unattended/headless operation.
# The menu can still be used: any key within 5s stops the countdown.
include menu.cfg
default vesamenu.c32
prompt 0
timeout 50

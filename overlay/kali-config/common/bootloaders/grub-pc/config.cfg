# Live Image (UEFI boot)
set default=0

loadfont $prefix/unicode.pf2
set gfxmode=auto
insmod all_video
insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

# Comment these two lines out to disable the beep on boot
insmod play
play 960 440 1 0 4 440 1

# kali-live-headless: auto-boot the default entry after 5s (upstream's
# config.cfg sets no timeout, so GRUB would wait at the menu forever).
# Sourced from grub.cfg before the menu is shown, so this takes effect.
# Any key within 5s stops the countdown and opens the menu.
set timeout=5
